name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

jobs:
  deploy:
    permissions:
      id-token: write
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTIONS_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image (no push)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.REPOSITORY }}
        run: |
          docker build --platform linux/arm64 -t $ECR_REGISTRY/$REPOSITORY:prod .

      - name: Detect ORM and package migration files
        env:
          REPOSITORY: ${{ vars.REPOSITORY }}
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            echo "ORM=prisma" >> $GITHUB_ENV
            zip -r /tmp/migration.zip \
              prisma/ package.json pnpm-lock.yaml pnpm-workspace.yaml prisma.config.ts 2>/dev/null || \
            zip -r /tmp/migration.zip \
              prisma/ package.json pnpm-lock.yaml pnpm-workspace.yaml
          elif [ -f "drizzle.config.ts" ]; then
            echo "ORM=drizzle" >> $GITHUB_ENV
            zip -r /tmp/migration.zip \
              drizzle/ drizzle.config.ts server/db/ package.json pnpm-lock.yaml pnpm-workspace.yaml
          else
            echo "No supported ORM detected (expected prisma/ or drizzle/)"
            exit 1
          fi
          aws s3 cp /tmp/migration.zip \
            s3://npts-env-bucket/$REPOSITORY/migrations/${{ github.sha }}.zip

      - name: Run migration via Lambda
        env:
          REPOSITORY: ${{ vars.REPOSITORY }}
        run: |
          aws lambda invoke \
            --function-name npts-migration \
            --invocation-type RequestResponse \
            --cli-read-timeout 900 \
            --payload '{
              "project": "'$REPOSITORY'",
              "environment": "prod",
              "orm": "'$ORM'",
              "migration_bucket": "npts-env-bucket",
              "migration_key": "'$REPOSITORY'/migrations/'${{ github.sha }}'.zip"
            }' \
            /tmp/lambda-response.json

          STATUS=$(jq -r '.status' /tmp/lambda-response.json)
          if [ "$STATUS" != "success" ]; then
            MESSAGE=$(jq -r '.message // "Unknown error"' /tmp/lambda-response.json)
            echo "Migration failed: $MESSAGE"
            exit 1
          fi
          echo "Migration succeeded"

      - name: Push image and deploy
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.REPOSITORY }}
          CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
          SERVICE_NAME: ${{ vars.REPOSITORY }}-prod-service
        run: |
          docker push $ECR_REGISTRY/$REPOSITORY:prod
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --desired-count 1 \
            --force-new-deployment \
            --output text \
            --query "service.serviceName" >/dev/null
          echo "Deployed $SERVICE_NAME"
